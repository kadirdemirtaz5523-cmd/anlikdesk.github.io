<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnlıkDesk - Haber Seç ve Düzenle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #17212b;
            color: #ffffff;
            padding: 16px;
            margin: 0;
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #7f91a4;
            text-transform: uppercase;
        }
        select, input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #232e3c;
            background-color: #242f3d;
            color: #ffffff;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        textarea { height: 110px; resize: vertical; }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #2481cc;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="form-group">
        <label for="haberSecim">Düzenlenecek Haberi Seçin</label>
        <select id="haberSecim" onchange="haberDegisti()">
            <option value="">Yükleniyor...</option>
        </select>
    </div>

    <div class="form-group">
        <label for="baslik">Haber Başlığı</label>
        <input type="text" id="baslik" placeholder="Başlık girin...">
    </div>
    
    <div class="form-group">
        <label for="ozet">Haber Özeti / Spot</label>
        <textarea id="ozet" placeholder="Özet girin..."></textarea>
    </div>

    <button class="btn-submit" onclick="gonder()">Görseli Yeniden Oluştur</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let haberlerVerisi = {};

        // URL'den haber listenisini al
        const urlParams = new URLSearchParams(window.location.search);
        const rawData = urlParams.get('data');

        if (rawData) {
            try {
                haberlerVerisi = JSON.parse(decodeURIComponent(rawData));
                const selectEl = document.getElementById('haberSecim');
                selectEl.innerHTML = '';

                const keys = Object.keys(haberlerVerisi);
                if (keys.length === 0) {
                    selectEl.innerHTML = '<option value="">Aktif haber bulunamadı</option>';
                } else {
                    keys.forEach((msgId, index) => {
                        const h = haberlerVerisi[msgId];
                        const opt = document.createElement('option');
                        opt.value = msgId;
                        opt.textContent = `[#${h.no}] ${h.baslik.substring(0, 35)}...`;
                        selectEl.appendChild(opt);
                    });
                    // İlk haberi otomatik doldur
                    haberDegisti();
                }
            } catch (e) {
                console.error("Veri okuma hatası", e);
            }
        }

        function haberDegisti() {
            const selectEl = document.getElementById('haberSecim');
            const secilenId = selectEl.value;
            if (secilenId && haberlerVerisi[secilenId]) {
                document.getElementById('baslik').value = haberlerVerisi[secilenId].baslik || '';
                document.getElementById('ozet').value = haberlerVerisi[secilenId].ozet || '';
            }
        }

        function gonder() {
            const selectEl = document.getElementById('haberSecim');
            const msgId = selectEl.value;
            const yeniBaslik = document.getElementById('baslik').value;
            const yeniOzet = document.getElementById('ozet').value;

            if (!msgId) {
                alert("Lütfen düzenlenecek bir haber seçin!");
                return;
            }

            const payload = JSON.stringify({
                msg_id: msgId,
                baslik: yeniBaslik,
                ozet: yeniOzet
            });

            tg.sendData(payload);
            tg.close();
        }
    </script>
</body>
</html>
