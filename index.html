<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnlıkDesk - Metin Düzenle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #17212b;
            color: #ffffff;
            padding: 16px;
            margin: 0;
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #7f91a4;
            text-transform: uppercase;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #232e3c;
            background-color: #242f3d;
            color: #ffffff;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        textarea { height: 110px; resize: vertical; }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #2481cc;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="form-group">
        <label for="baslik">Haber Başlığı</label>
        <input type="text" id="baslik" placeholder="Başlık girin...">
    </div>
    
    <div class="form-group">
        <label for="ozet">Haber Özeti / Spot</label>
        <textarea id="ozet" placeholder="Özet girin..."></textarea>
    </div>

    <button class="btn-submit" id="btnSubmit" onclick="gonder()">Görseli Yeniden Oluştur</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('baslik').value = urlParams.get('baslik') || '';
        document.getElementById('ozet').value = urlParams.get('ozet') || '';

        async function gonder() {
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "Gönderiliyor...";
            btn.disabled = true;

            const yeniBaslik = document.getElementById('baslik').value;
            const yeniOzet = document.getElementById('ozet').value;
            const msgId = urlParams.get('msg_id') || '0';

            const botToken = "9156283686:AAF-b7B8Nt2GP2SO7XT95xYBEVtvweowtVA";
            const chatId = "1192631792";

            const iletiMetni = `/duzelt ID:${msgId}\nBASLIK:${yeniBaslik}\nOZET:${yeniOzet}`;

            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: iletiMetni
                    })
                });
            } catch (e) {
                console.error(e);
            }
            tg.close();
        }
    </script>
</body>
</html>
